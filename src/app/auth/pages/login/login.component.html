<div class="h-screen w-full overflow-hidden flex items-center justify-center" style="background: #edf2f7;">
  <div class="bg-white w-full dark:bg-gray-900">
      <div class="flex justify-center h-screen">
          <div id="container-image-background" class="hidden bg-cover lg:block lg:w-2/3">
              <div class="flex items-center h-full px-20 bg-gray-900 bg-opacity-40">
                  <div>     
                      <p class="max-w-xl mt-3 text-mp-primary font-bold text-3xl">
                        Nos preocupamos por las personas y el papel del trabajo en sus vidas
                      </p>
                  </div>
              </div>
          </div>
          
          <div class="flex items-center w-full max-w-md px-6 mx-auto lg:w-2/6">
              <div class="flex-1">
                  <div class="text-center">
                      <h2 class="text-4xl font-bold text-center text-mp-primary dark:text-white">Ingresa a tu cuenta</h2>
                  </div>

                  <div class="mt-8">
                      <form (ngSubmit)="login()" [formGroup]="loginForm">
                          <div>
                              <label for="email" class="block mb-2 text-sm text-mp-primary dark:text-gray-200">Correo electrónico</label>
                              <input formControlName="email" type="email" name="email" id="email" class="block w-full px-4 py-2 mt-2 text-gray-700 bg-white border border-gray-200 rounded-md dark:placeholder-gray-600 dark:bg-gray-900 dark:text-gray-300 dark:border-gray-700 focus:border-blue-400 dark:focus:border-blue-400 focus:ring-blue-400 focus:outline-none focus:ring focus:ring-opacity-40" />
                          </div>

                          <div class="mt-6">
                              <div class="flex justify-between mb-2">
                                  <label for="password" class="text-sm text-mp-primary dark:text-gray-200">Contraseña</label>
                              </div>

                              <input formControlName="password" type="password" name="password" id="password" class="block w-full px-4 py-2 mt-2 text-gray-700 placeholder-gray-400 bg-white border border-gray-200 rounded-md dark:placeholder-gray-600 dark:bg-gray-900 dark:text-gray-300 dark:border-gray-700 focus:border-blue-400 dark:focus:border-blue-400 focus:ring-blue-400 focus:outline-none focus:ring focus:ring-opacity-40" />
                          </div>

                          <div class="flex mt-6 w-full">
                             <button type="submit" class="w-full px-4 py-2 tracking-wide text-white bg-mp-warn  rounded-md hover:bg-mp-accent focus:outline-none">
                                    Sign in
                            </button>
                          </div>

                      </form>

                  </div>
              </div>
          </div>
      </div>
  </div>
</div>
