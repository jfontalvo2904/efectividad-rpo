@if(this.isLoading()) {
  <shared-loading-modal></shared-loading-modal>
}

<div class="h-screen flex justify-center items-center bg-mp-light-blue">
  <div class="w-1/2">
    <form class="login-container" (ngSubmit)="login()" [formGroup]="loginForm">
      <div class="email">
        <label for="email">Correo electrónico</label>
        <div class="sec-2">
          <input
            class="w-full"
            formControlName="email"
            type="email"
            name="email"
            placeholder="Username@gmail.com"
          />
        </div>
      </div>
      <div class="password">
        <label for="password">Contraseña</label>
        <div class="sec-2">
          <input
            formControlName="password"
            class="pas w-full"
            type="password"
            name="password"
            placeholder="············"
          />
        </div>
      </div>
      @if(!isLoading()) {
        <button type="submit" class="login bg-mp-light-blue hover:bg-mp-blue focus:bg-mp-orange">Login</button>
      }@else {
        <button class="login bg-gray-300 cursor-not-allowed opacity-50" disabled>
          Login
        </button>
      }
      
      <div class="footer">
        <span>¿Olvidaste tu contraseña?</span>
      </div>
    </form>
  </div>
</div>
