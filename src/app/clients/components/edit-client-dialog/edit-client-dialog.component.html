<h2 mat-dialog-title>{{data.title}}</h2>

<mat-dialog-content>
    <form [formGroup]="clientForm">
        
        <div class="flex gap-2">
            <div class="flex flex-col gap-2 flex-wrap">
                <mat-form-field>
                    <mat-label>NIT</mat-label>
                    <input formControlName="nit" matInput placeholder="NIT">
                </mat-form-field>
                
                <mat-form-field>
                    <mat-label>Name</mat-label>
                    <input formControlName="name" matInput placeholder="Name">
                </mat-form-field>
                <mat-form-field>
                    <mat-label>Business name</mat-label>
                    <input formControlName="businessName" matInput placeholder="Business name">
                </mat-form-field>
                <mat-form-field>
                    <mat-label>Date Intro</mat-label>
                    <input matInput [matDatepicker]="picker1" formControlName="dateIntro">
                    <mat-hint>YYYY/MM/DD</mat-hint>
                    <mat-datepicker-toggle matIconSuffix [for]="picker1"></mat-datepicker-toggle>
                    <mat-datepicker #picker1></mat-datepicker>
                </mat-form-field>

               
              </div>
    
              <div class="flex flex-col gap-2 flex-wrap">
            
                <mat-form-field>
                    <mat-label>Ans Submission</mat-label>
                    <input formControlName="ansSubmission" matInput placeholder="Ans submission">
                </mat-form-field>
                <mat-form-field>
                    <mat-label>Ans closing</mat-label>
                    <input formControlName="ansClosing" matInput placeholder="Ans closing">
                </mat-form-field>
                <div class="flex justify-center items-center h-8">
                    <mat-slide-toggle class="m-3" formControlName="isActivate" color="primary">Activar Cliente</mat-slide-toggle>
                </div>
                
              </div>
        </div>
    </form>
   
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-button (click)="onNoClick()">Cancelar</button>
  <button mat-button [disabled]="clientForm.invalid" [mat-dialog-close]="aceptar()">Aceptar</button>
</mat-dialog-actions>
